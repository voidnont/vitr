<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>vitr</title>
  <link rel="icon" href="./vitr-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles-1.css" />
  <link rel="stylesheet" href="./styles-2.css" />
  <link rel="stylesheet" href="./styles-3.css" />
  <link rel="stylesheet" href="./styles-4.css" />
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>
  <div id="ambient-shade" aria-hidden="true"></div>

  <header class="titlebar glass-lite" data-vitr-drag-region data-tauri-drag-region>
    <div class="brand" data-vitr-drag-region data-tauri-drag-region>
      <img class="brand-mark" src="./vitr-icon.svg" alt="" aria-hidden="true" draggable="false" data-tauri-drag-region />
      <div data-vitr-drag-region data-tauri-drag-region>
        <strong data-tauri-drag-region>vitr</strong>
        <span data-tauri-drag-region>by blood</span>
      </div>
    </div>
    <div class="titlebar-center" data-vitr-drag-region data-tauri-drag-region></div>
    <div class="window-actions">
      <button class="window-button" data-window="minimize" aria-label="Minimize">—</button>
      <button class="window-button" data-window="maximize" aria-label="Maximize">□</button>
      <button class="window-button close" data-window="close" aria-label="Exit vitr">×</button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast-host" class="toast-host" aria-live="assertive"></div>
  <audio id="audio" preload="metadata"></audio>

  <script type="module" src="./window-controls.mjs"></script>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
