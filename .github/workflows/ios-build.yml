name: Build Vitr iOS

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitr-ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Sync version
        run: node scripts/sync-version.mjs

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project mobile/ios/Vitr.xcodeproj \
            -scheme Vitr \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build sideload device app
        run: |
          xcodebuild \
            -project mobile/ios/Vitr.xcodeproj \
            -scheme Vitr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify Vitr metadata
        shell: bash
        run: |
          SIM_APP="build/ios-simulator/Build/Products/Release-iphonesimulator/Vitr.app"
          DEVICE_APP="build/ios-device/Build/Products/Release-iphoneos/Vitr.app"

          test -d "$SIM_APP"
          test -d "$DEVICE_APP"

          for APP in "$SIM_APP" "$DEVICE_APP"; do
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
            BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
            PUBLISHER=$(/usr/libexec/PlistBuddy -c 'Print :VitrPublisher' "$APP/Info.plist")
            test "$VERSION" = "${{ steps.version.outputs.value }}"
            test "$BUILD" -ge "1"
            test "$BUNDLE" = "com.bloodvitr.vitr"
            test "$PUBLISHER" = "Blood"
          done

          test ! -d "$DEVICE_APP/_CodeSignature"
          test ! -f "$DEVICE_APP/embedded.mobileprovision"

      - name: Package simulator and sideload IPA
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Release-iphonesimulator/Vitr.app \
            Vitr-${{ steps.version.outputs.value }}-ios-simulator.zip

          rm -rf Payload
          mkdir Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/Vitr.app Payload/
          rm -rf Payload/Vitr.app/_CodeSignature
          rm -f Payload/Vitr.app/embedded.mobileprovision
          zip -qry Vitr-${{ steps.version.outputs.value }}-sideload.ipa Payload

          unzip -l Vitr-${{ steps.version.outputs.value }}-sideload.ipa | grep -F 'Payload/Vitr.app/'
          test -s Vitr-${{ steps.version.outputs.value }}-sideload.ipa

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Vitr-${{ steps.version.outputs.value }}-iOS-Simulator
          path: Vitr-${{ steps.version.outputs.value }}-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Vitr-${{ steps.version.outputs.value }}-iOS-Sideload
          path: Vitr-${{ steps.version.outputs.value }}-sideload.ipa
          if-no-files-found: error
          retention-days: 30
