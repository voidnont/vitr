name: Repository hygiene audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-hygiene-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan source tree
        shell: bash
        run: |
          set -euo pipefail
          EXCLUDE='.github/workflows/repo-hygiene-audit.yml'
          PATTERN='voidnont|VOID_|ChatGPT|OpenAI|Claude|Gemini|Copilot|\bLLM\b|artificial intelligence|AI[- ]generated|generated by AI|superpowers|FRXE_'
          if grep -RniI -E "$PATTERN" .               --exclude-dir=.git               --exclude='package-lock.json'               --exclude='Cargo.lock'               | grep -v -F "$EXCLUDE"; then
            echo "Disallowed legacy/provenance marker found."
            exit 1
          fi
          echo "Repository hygiene audit passed."
