name: Desktop Windows Installers

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  build-msi:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout vitr
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Read release version
        id: release
        shell: pwsh
        run: |
          "version=$(node tools/release-metadata.mjs version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure optional Windows signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if (-not $hasCertificate -and -not $hasPassword) {
            "VITR_WINDOWS_DISTRIBUTION=validation-only" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Windows signing credentials are not configured; producing validation-only installers."
            exit 0
          }

          if (-not ($hasCertificate -and $hasPassword)) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must either both be set or both be absent."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "WINDOWS_TIMESTAMP_URL repository variable is required when Windows signing is enabled."
          }

          $thumbprint = (& .\platforms\windows\import-signing-certificate.ps1).Trim()
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            throw "Windows signing certificate import did not return a thumbprint."
          }

          $signingConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 4

          Set-Content -LiteralPath "src-tauri\tauri.windows.conf.json" -Value $signingConfig -Encoding utf8
          "VITR_WINDOWS_DISTRIBUTION=signed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          & .\platforms\windows\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows signature when configured
        if: env.VITR_WINDOWS_DISTRIBUTION == 'signed'
        shell: pwsh
        run: |
          $packages = @(
            "release-upload/vitr-${{ steps.release.outputs.version }}-setup.exe",
            "release-upload/vitr-${{ steps.release.outputs.version }}-x64.msi"
          )
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -FilePath $package
            if ($signature.Status -ne 'Valid') {
              throw "Windows package signature is not valid for $package: $($signature.Status) $($signature.StatusMessage)"
            }
          }
          Write-Host "Windows Authenticode signatures are valid."

      - name: Upload vitr Windows package
        uses: actions/upload-artifact@v4
        with:
          name: vitr-${{ steps.release.outputs.version }}-Windows
          path: |
            desktop/release-upload/vitr-${{ steps.release.outputs.version }}-setup.exe
            desktop/release-upload/vitr-${{ steps.release.outputs.version }}-x64.msi
          if-no-files-found: error
