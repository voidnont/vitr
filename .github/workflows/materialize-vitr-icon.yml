name: Materialize supplied Vitr icon

on:
  push:
    branches: [main]
    paths:
      - '.brand-transfer/**'
      - '.github/workflows/materialize-vitr-icon.yml'

permissions:
  contents: write

concurrency:
  group: vitr-brand-asset-transfer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact supplied artwork
        shell: bash
        run: |
          cat \
            .brand-transfer/00.b64 \
            .brand-transfer/01.b64 \
            .brand-transfer/02.b64 \
            .brand-transfer/03.b64 \
            .brand-transfer/04.b64 \
            .brand-transfer/05.b64 \
            .brand-transfer/06.b64 \
            .brand-transfer/07.b64 \
            .brand-transfer/08.b64 \
            .brand-transfer/09.b64 \
            | base64 -d > web/public/vitr-icon.png
          echo "fa8d9b43dcaa169a578e004f0c74039d96c58872e417df78b5faa737404f94e6  web/public/vitr-icon.png" | sha256sum -c -

      - name: Commit materialized icon
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .brand-transfer
          git rm .github/workflows/materialize-vitr-icon.yml
          git add web/public/vitr-icon.png
          git commit -m "brand: materialize supplied Vitr icon"
          git push
