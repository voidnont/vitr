name: Delete temporary verify branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-temp-branch.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete temporary verification branch
        run: git push origin --delete verify/android-apk-0.1.0
