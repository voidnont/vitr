name: Build Vitr Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build installable release APK
        working-directory: mobile/android
        env:
          VITR_CI_RELEASE_DEBUG_SIGNING: '1'
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Verify Vitr 0.1.0 APK metadata
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee /tmp/vitr-apk-badging.txt
          grep -F "package: name='com.bloodvitr.vitr' versionCode='1' versionName='0.1.0'" /tmp/vitr-apk-badging.txt
          cp "$APK" "Vitr-0.1.0-android.apk"

      - name: Upload Vitr APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitr-0.1.0-APK
          path: Vitr-0.1.0-android.apk
          if-no-files-found: error
          retention-days: 30
