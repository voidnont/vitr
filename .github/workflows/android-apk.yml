name: Build Vitr Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitr-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        run: gradle -p mobile/android :app:assembleDebug --no-daemon

      - name: Verify APK metadata
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee mobile/android/apk-badging.txt
          grep -F "package: name='app.vitr.android' versionCode='1' versionName='0.1.0'" mobile/android/apk-badging.txt
          cp "$APK" "vitr-0.1.0.apk"

      - name: Upload Vitr APK
        uses: actions/upload-artifact@v4
        with:
          name: vitr-0.1.0-Android
          path: vitr-0.1.0.apk
          if-no-files-found: error
          retention-days: 30
