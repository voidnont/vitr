name: Build standalone Vitr UI APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build signed release APK
        run: gradle -p mobile/android :app:assembleRelease --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/vitr-0.1.0-ui.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vitr-0.1.0-ui-apk
          path: out/vitr-0.1.0-ui.apk
          if-no-files-found: error
