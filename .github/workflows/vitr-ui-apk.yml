name: Build standalone Vitr UI APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        run: gradle -p mobile/android :app:assembleRelease --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/vitr-${{ steps.version.outputs.value }}-ui.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: vitr-${{ steps.version.outputs.value }}-ui-apk
          path: out/vitr-${{ steps.version.outputs.value }}-ui.apk
          if-no-files-found: error
